[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lantern"
version = "0.1.0"
description = "Reproducible ingestion and parsing pipeline for SEC 10-K/10-Q filings."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Akhilesh Kasturi" }]

dependencies = [
    # ingest
    "sec-edgar-downloader>=5.0.3",
    "requests>=2.32",
    # parsing (added incrementally per epic)
    "pdfplumber>=0.11",
    # config + schema
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "click>=8.1",
    # logging
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "pre-commit>=3.7",
    "mypy>=1.10",
]
# Heavy parsers are kept optional so CI can stay light.
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17", "pillow>=10.0"]
tables = ["camelot-py[base]>=0.11", "opencv-python-headless>=4.10"]
layout = ["layoutparser[effdet]>=0.3.4", "torch>=2.2", "torchvision>=0.17"]
docling = ["docling>=2.0"]
xbrl = ["arelle-release>=2.30"]
managed = ["google-genai>=0.3"]

[project.scripts]
lantern = "lantern.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # black handles line length

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
